name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One run per ref: a new push cancels the previous, still-running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # gradle.properties pins org.gradle.java.home to a local macOS Homebrew JDK 21
      # (see handoff.md - the developer machine has an unsupported system JDK).
      # That absolute path does not exist on the runner and Gradle would fail before
      # configuration, so the line is stripped here. CI gets its JDK 21 from
      # actions/setup-java below instead.
      - name: Neutralise local org.gradle.java.home
        run: |
          sed -i '/org.gradle.java.home/d' gradle.properties
          echo "--- gradle.properties used by CI ---"
          cat gradle.properties

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The wrapper jar is committed, so verify it against Gradle's published checksums
      # before executing it — especially in release, where it runs with signing secrets.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Definition of Done (PLAN.md sekce 11) vyžaduje ktlint. Běží první, protože
      # je nejrychlejší a formátovací chyby nemá smysl hledat až po celém buildu.
      - name: ktlint
        run: ./gradlew ktlintCheck --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: detektormapy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/ktlint/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 14

  tools:
    name: Python pipeline tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The desktop pipeline under tools/ is optional: the guard below keeps the job
      # green on a checkout that has no tests yet, but a failing test is a hard failure.
      - name: Detect tool tests
        id: detect
        run: |
          if [ -n "${{ hashFiles('tools/test_*.py', 'tools/**/test_*.py') }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Zadne testy v tools/ - preskakuji."
          fi

      - name: Set up Python 3.11
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tool dependencies
        if: steps.detect.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f tools/requirements.txt ]; then
            pip install -r tools/requirements.txt
          fi

      - name: Run tool unit tests
        if: steps.detect.outputs.present == 'true'
        continue-on-error: false
        run: python -m unittest discover -s tools -p 'test_*.py' -v
