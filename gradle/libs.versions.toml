[versions]
agp = "8.13.2"
kotlin = "2.3.21"
ksp = "2.3.11"
hilt = "2.57.2"
room = "2.8.4"
composeBom = "2026.06.01"
coreKtx = "1.18.0"
lifecycle = "2.9.4"
activityCompose = "1.13.0"
navigationCompose = "2.9.8"
maplibre = "11.11.0"
